name: harness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: scripts/harness/check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Go and Node steps will become active once go.mod / web/package.json land
      # (the script no-ops them otherwise). Set them up unconditionally so the
      # cache is warm by the time M00 lands.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
        if: hashFiles('go.mod') != ''
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
        if: hashFiles('pnpm-lock.yaml') != ''
      - name: install web deps
        run: pnpm install --frozen-lockfile
        if: hashFiles('pnpm-lock.yaml') != ''
      - name: harness
        run: ./scripts/harness/check.sh
